openapi: 3.2.0
info:
  title: Blue API reference Billing API
  description: Alphaus provides an API for interacting with its services.
  version: v1
servers:
- url: https://api.alphaus.cloud/m/blue
tags:
- name: Billing
  description: '(BETA) Billing API. Base URL: https://api.alphaus.cloud/m/blue/billing'
  externalDocs:
    description: Service definition
    url: https://github.com/alphauslabs/blueapi/tree/main/billing/
paths:
  /billing/v1/reseller/announcements/{announcementId}:
    get:
      summary: Gets the announcement list
      operationId: Billing_GetAnnouncements
      responses:
        '200':
          description: A successful response.(streaming responses)
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/v1Announcement'
                  error:
                    $ref: '#/components/schemas/rpcStatus'
                title: Stream result of v1Announcement
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: announcementId
        description: Optional. Set empty to return all
        in: path
        required: true
        schema:
          type: string
      tags:
      - Billing
  /v1/accessgroups:
    get:
      summary: Lists access group. Only available in Ripple
      operationId: Billing_ListAccessGroups
      responses:
        '200':
          description: A successful response.(streaming responses)
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/apiRippleAccessGroup'
                  error:
                    $ref: '#/components/schemas/rpcStatus'
                title: Stream result of apiRippleAccessGroup
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: fieldMask
        description: 'Optional. Get only the value that set fieldMask.


          see more info: https://github.com/protocolbuffers/protobuf/blob/main/src/google/protobuf/field_mask.proto'
        in: query
        required: false
        schema:
          type: string
      tags:
      - Billing
    post:
      summary: Registers the access group. Only available in Ripple
      operationId: Billing_CreateAccessGroup
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiRippleAccessGroup'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      tags:
      - Billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1CreateAccessGroupRequest'
        description: Request message for the CreateAccessGroup rpc.
        required: true
