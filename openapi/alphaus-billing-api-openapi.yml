        type: string
      - name: internalId
        description: Required. Internal Id
        in: path
        required: true
        type: string
      tags:
      - Billing
    post:
      summary: Sets the customized billing service in child billing group. Only available in Ripple.
      operationId: Billing_SetChildBillingGroupCustomizedBillingService
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties: {}
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: vendor
        description: Required. At the moment, `aws` is supported.
        in: path
        required: true
        type: string
      - name: internalId
        description: Required. internal id of the child billing group.
        in: path
        required: true
        type: string
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/BillingSetChildBillingGroupCustomizedBillingServiceBody'
      tags:
      - Billing
  /v1/{vendor}/exchangerate/{month}:
    get:
      summary: ListExchangeRates
      description: 'Lists all exchange rate.

        > Only available in Ripple.'
      operationId: Billing_ListExchangeRates
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/blueapiBillingV1ListExchangeRatesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: vendor
        description: Required. vendor.
        in: path
        required: true
        type: string
      - name: month
        description: 'Required. month. Format: `yyyymm`.'
        in: path
        required: true
        type: string
      tags:
      - Billing
  /v1/{vendor}/invoiceadjustments:read:
    post:
      summary: Reads the adjustment details involved in invoicing of an organization billing group (Wave).
      operationId: Billing_ReadInvoiceAdjustments
      responses:
        '200':
          description: A successful response.(streaming responses)
          schema:
            type: object
            properties:
              result:
                $ref: '#/definitions/waveAdjustment'
              error:
                $ref: '#/definitions/rpcStatus'
            title: Stream result of waveAdjustment
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: vendor
        description: Required. At the moment, only `aws`,`azure`,`gcp` is supported.
        in: path
        required: true
        type: string
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/BillingReadInvoiceAdjustmentsBody'
      tags:
      - Billing
  /v1/{vendor}/services:
    get:
      summary: 'Lists available cloud services and their associated SKUs for a given vendor.

        Use this to retrieve service codes and names that can be referenced in exclude service settings.'
      operationId: Billing_ListServices
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListServicesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: vendor
        description: Required. Cloud vendor (e.g., "gcp"). Bound from the URL path.
        in: path
        required: true
        type: string
      - name: code
        description: 'Optional. Service code to filter by.

          Example values: "6F81-5844-456A" (Cloud Storage), "95FF-2EF5-5EA1" (Compute Engine),

          "152E-C115-5142" (Cloud SQL).

          Use ListServices without this field to retrieve all available service codes.'
        in: query
        required: false
        type: string
      tags:
      - Billing
  /v1/{vendor}/tagsaddingsetting/{groupId}:
    get:
      operationId: Billing_GetTagsAddingSetting
      responses:
        '200':
          description: A successful response.(streaming responses)
          schema:
            type: object
