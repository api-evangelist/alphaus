        type: string
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/GuaranteedCommitmentsReadCommitmentReportAccountsBody'
      tags:
      - GuaranteedCommitments
  /v1/reports/invoice:read:
    post:
      summary: Reads monthly commitment reports for the MSP. Only available in Ripple.
      operationId: GuaranteedCommitments_ReadCommitmentReports
      responses:
        '200':
          description: A successful response.(streaming responses)
          schema:
            type: object
            properties:
              result:
