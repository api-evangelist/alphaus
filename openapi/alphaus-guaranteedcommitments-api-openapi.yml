components:
  schemas:
    v1CreateCustomCommitmentPlanRequest:
      type: object
      properties:
        provider:
          type: string
          description: 'Required. The cloud provider. Acceptable values: "aws", "azure", "gcp".'
        startDate:
          type: string
          description: Required. ISO 8601 lookback window start timestamp (e.g. "2026-04-09T02:43:39.717Z").
        endDate:
          type: string
          description: Required. ISO 8601 lookback window end timestamp (e.g. "2026-04-16T02:43:39.717Z").
        companyId:
          type: string
          description: Required. The company ID to scope the plan to.
        status:
          type: string
          description: 'Plan status. Use "draft" to save without submitting.

            Acceptable values: "draft", "submitted".'
        description:
          type: string
          description: Optional. Human-readable description for the plan.
        name:
          type: string
          description: Required. Human-readable name for the plan.
        includedContractSpecs:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/v1ContractSpec'
          description: "List of contract specifications to include in the plan.\nEach entry selects a commitment category, term, payment option, and optional properties.\n\nAcceptable commitment_type values:\n  \"aws/AmazonEC2\", \"aws/AmazonRDS\", \"aws/AmazonElastiCache\",\n  \"aws/savingsplan/Compute\", \"aws/savingsplan/EC2Instance\", \"aws/savingsplan/Database\"\n\nAcceptable term values:\n  \"thirty_day_gris\"  - 30-day Archera Insured (leased: true)\n  \"one_year_gris\"    - 1-year Archera Insured (leased: true)\n  \"one_year\"         - 1-year Native Uninsured (leased: false)\n  \"three_year\"       - 3-year Native Uninsured (leased: false)\n\nAcceptable payment_option values:\n  \"no_upfront\", \"partial_upfront\", \"all_upfront\"\n  Note: \"partial_upfront\" and \"all_upfront\" are not available for 30-day terms.\n\nAcceptable properties keys:\n  \"leased\" (bool)          - true for Archera Insured terms, false for Native terms.\n  \"offering_class\" (string) - only for \"aws/AmazonEC2\"; \"convertible\" or \"standard\"."
        includedContractTerms:
          type: array
          items:
            type: string
          description: 'List of contract term keys included in the plan.

            Acceptable values: "thirty_day_gris", "one_year_gris", "one_year", "three_year".'
        resourceIds:
          type: array
          items:
            type: string
          description: 'Optional. Specific resource IDs to pin the plan to selected infrastructure resources.

            When populated, the server returns plan_type "infrastructure"; omit for a top-down

            "purchase" plan. IDs are composite strings in the format

            "{resource_id}|{catalog_sku_org_id}|{catalog_sku_id}" as returned by ListReservableResources.'
        companyIds:
          type: array
          items:
            type: string
          description: 'For top down creation, one or more company IDs to create a plan per segment.

            Mutually exclusive with companyId — do not set both.'
      description: CreateCustomCommitmentPlanRequest creates a new top-down custom commitment plan.
    v1GetResourceDailyUsageResponse:
      type: object
      properties:
        dailyUsage:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/v1ResourceDailyUsage'
    v1GetAzureOnboardingAuthUrlResponse:
      type: object
      properties:
        url:
          type: string
          description: The Microsoft OAuth URL the user must open to authorize Archera.
      description: GetAzureOnboardingAuthUrlResponse contains the OAuth URL (Step 4).
    GuaranteedCommitmentsSetBillingGroupStatusBody:
      type: object
      properties:
        enabled:
          type: boolean
        newVersion:
          type: boolean
          description: 'temporarily required until we fully transition to the new onboarding flow.

            This is to avoid any breaks or crash during the transition. Will be removed once the transition is complete.

            Default value is false.'
    v1CommitmentPlanLineItem:
      type: object
      properties:
        id:
          type: string
        planId:
          type: string
        offerId:
          type: string
        leaseMenuItemId:
          type: string
        accountId:
          type: string
        recommendedQuantity:
          type: number
          format: double
        selectedQuantity:
          type: number
          format: double
        recommendedCommitment:
          type: number
          format: double
        selectedCommitment:
          type: number
          format: double
        isSelected:
          type: boolean
        afterAmortizedCost:
          type: number
          format: double
        upfrontCost:
          type: number
          format: double
        recurringCost:
          type: number
          format: double
        beforeCost:
          type: number
          format: double
        beforeOndemandCost:
          type: number
          format: double
        beforeReservedCost:
          type: number
          format: double
        coveredOndemandCost:
          type: number
          format: double
        afterCoveredUnits:
          type: number
          format: double
        totalCost:
          type: number
          format: double
        monthlyCost:
          type: number
          format: double
        savings:
          type: number
          format: double
        monthlySavings:
          type: number
          format: double
        totalSavings:
          type: number
          format: double
        fee:
          type: number
          format: double
        discountRate:
          type: number
          format: double
        breakevenHours:
          type: number
          format: double
        contractTerm:
          type: string
        paymentOption:
          type: string
        contractSpec:
          type: object
        offer:
          type: object
        renewalReservationId:
          type: string
        coveredUnits:
          type: number
          format: double
        amortizedCost:
          type: number
          format: double
    GuaranteedCommitmentsSetPayerAccountEnabledBody:
      type: object
