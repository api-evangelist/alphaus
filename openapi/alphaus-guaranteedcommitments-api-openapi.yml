        required: false
        type: boolean
      - name: orderBy
        in: query
        required: false
        type: string
      - name: page
        in: query
        required: false
        type: integer
        format: int32
      - name: pageSize
        in: query
        required: false
        type: integer
        format: int32
      tags:
      - GuaranteedCommitments
  /v1/resources/{resourceId}/dailyusage:
    get:
      summary: 'WORK-IN-PROGRESS: Do not use. Retrieves daily usage data for a specific resource within
