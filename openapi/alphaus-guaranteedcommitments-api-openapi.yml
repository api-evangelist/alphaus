      - name: catalogSkuId
        in: query
        required: false
        type: string
      - name: page
        in: query
        required: false
        type: integer
        format: int32
      - name: pageSize
        in: query
        required: false
        type: integer
        format: int32
      tags:
      - GuaranteedCommitments
