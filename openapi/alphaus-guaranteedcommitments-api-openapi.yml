openapi: 3.2.0
info:
  title: Blue API reference Guaranteed Commitments API
  description: Alphaus provides an API for interacting with its services.
  version: v1
servers:
- url: https://api.alphaus.cloud/m/blue
tags:
- name: GuaranteedCommitments
  description: '(Alpha) GuaranteedCommitments API. Base URL: https://api.alphaus.cloud/m/blue/gc'
  externalDocs:
    description: Service definition
    url: https://github.com/alphauslabs/blueapi/tree/main/gc/
paths:
  /v1/commitments:
    get:
      summary: 'WORK-IN-PROGRESS: Retrieves a list of commitments'
      operationId: GuaranteedCommitments_ListCommitments
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ListCommitmentsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      tags:
      - GuaranteedCommitments
  /v1/commitments/plan/{planId}/apply:
    post:
      summary: 'WORK-IN-PROGRESS: Executes a commitment purchase plan, initiating the…'
      operationId: GuaranteedCommitments_CommitmentsPlanApply
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1CommitmentPlanDetails'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: planId
        in: path
        required: true
        schema:
          type: string
      tags:
      - GuaranteedCommitments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuaranteedCommitmentsCommitmentsPlanApplyBody'
        required: true
  /v1/commitments/purchaseplans:
    get:
      summary: 'WORK-IN-PROGRESS: Retrieves purchase plan of a company'
      operationId: GuaranteedCommitments_ListPurchasePlansBySegment
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ListPurchasePlansBySegmentResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      tags:
      - GuaranteedCommitments
  /v1/commitments/purchaseplans/availabletypes:
    get:
      summary: 'WORK-IN-PROGRESS: Only works for Alphaus for now.'
      operationId: GuaranteedCommitments_GetAvailableCommitmentTypes
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1GetAvailableCommitmentTypesResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: provider
        description: 'Required. The cloud provider to query available types for.

          Acceptable values: "aws", "azure", "gcp".'
        in: query
        required: false
        schema:
          type: string
      tags:
      - GuaranteedCommitments
  /v1/commitments/purchaseplans/custom:
    post:
      summary: 'WORK-IN-PROGRESS: Only works for Alphaus for now.'
      operationId: GuaranteedCommitments_CreateCustomCommitmentPlan
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1CreateCustomCommitmentPlanResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      tags:
      - GuaranteedCommitments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1CreateCustomCommitmentPlanRequest'
        description: CreateCustomCommitmentPlanRequest creates a new top-down custom commitment plan.
        required: true
  /v1/commitments/purchaseplans/draft:
    get:
      summary: 'WORK-IN-PROGRESS: Retrieves the drafted purchase plans'
      operationId: GuaranteedCommitments_ListDraftPurchasePlans
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ListDraftPurchasePlansResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: isDraft
        description: If set to true, returns plans with Draft status. If set to false, returns plans with Submitted and Executed status.
        in: query
        required: false
        schema:
          type: boolean
      - name: companyId
        in: query
        required: false
        schema:
          type: string
      tags:
      - GuaranteedCommitments
  /v1/commitments/purchaseplans/draft/{draftPlanId}:
    delete:
      summary: 'WORK-IN-PROGRESS: Deletes a drafted purchase plan'
      operationId: GuaranteedCommitments_DeleteDraftPurchasePlan
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1DeleteDraftPurchasePlanResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: draftPlanId
        description: Required. The draft plan ID to delete.
        in: path
        required: true
        schema:
          type: string
      - name: companyId
        in: query
        required: false
        schema:
          type: string
      tags:
      - GuaranteedCommitments
  /v1/commitments/purchaseplans/draft/{planId}:
    post:
      summary: 'WORK-IN-PROGRESS: Saves a commitment purchase plan as draft'
      operationId: GuaranteedCommitments_SaveCommitmentsPlanAsDraft
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1DefaultPurchasePlan'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: planId
        description: Required. The commitment purchase plan ID to save as draft.
        in: path
        required: true
        schema:
          type: string
      tags:
      - GuaranteedCommitments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuaranteedCommitmentsSaveCommitmentsPlanAsDraftBody'
        required: true
  /v1/commitments/purchaseplans/{planId}:
    get:
      summary: 'WORK-IN-PROGRESS: Retrieves full details of a specific purchase plan of a…'
      operationId: GuaranteedCommitments_GetPurchasePlansDetails
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1GetPurchasePlansDetailsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: planId
        in: path
        required: true
        schema:
          type: string
      tags:
      - GuaranteedCommitments
  /v1/commitments/purchaseplans:update:
    post:
      summary: 'WORK-IN-PROGRESS: Get the updated details of the plan after the apply plan'
      operationId: GuaranteedCommitments_GetUpdatedPurchasePlansBySegment
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1GetUpdatedPurchasePlansBySegmentResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      tags:
      - GuaranteedCommitments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1GetUpdatedPurchasePlansBySegmentRequest'
        required: true
  /v1/commitments/resources:
    get:
      summary: 'WORK-IN-PROGRESS: Only works for Alphaus for now.'
      operationId: GuaranteedCommitments_ListReservableResources
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ListReservableResourcesResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: companyId
        description: "Required. The company ID to scope the query to.\n\n// Optional. Field to sort by. Example: \"ondemand_cost\".\n string orderBy = 2;\n // Optional. If true, sort in descending order.\n bool desc = 3;\n // Optional. URL-encoded JSON filter expression.\n // Example (decoded): {\"and\":[{\"and\":[{\"field\":\"covered_usage\",\"op\":\"<\",\"value\":1}]},{\"and\":[{\"field\":\"is_reservable\",\"op\":\"=\",\"value\":\"true\"}]}]}\n string filter = 4;\n // Required. Start of the usage lookback window (YYYY-MM-DD).\n string startDate = 5;\n // Required. End of the usage lookback window (YYYY-MM-DD).\n string endDate = 6;\n // Optional. Page number (1-based).\n int32 page = 7;\n // Optional. Number of results per page.\n int32 pageSize = 8;"
        in: query
        required: false
        schema:
          type: string
      tags:
      - GuaranteedCommitments
  /v1/commitments/{commitmentId}/chart:
    get:
      summary: 'WORK-IN-PROGRESS: Generates time-series chart data for commitment metrics over…'
      operationId: GuaranteedCommitments_GetCommitmentsChart
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1CommitmentsChartResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: commitmentId
        description: Required. The commitment id.
        in: path
        required: true
        schema:
          type: string
      - name: groupBy
        description: Required. The group filter. Available filters include `region`, `service`, `instanceType`, `instanceTypeFamily`, `usageType` and `operation`.
        in: query
        required: false
        schema:
          type: string
      - name: startDate
        in: query
        required: false
        schema:
          type: string
      - name: endDate
        in: query
        required: false
        schema:
          type: string
      tags:
      - GuaranteedCommitments
  /v1/commitments/{commitmentId}/utilization:
    get:
      summary: 'WORK-IN-PROGRESS: Generates utilization data for commitment over the active…'
      operationId: GuaranteedCommitments_GetCommitmentsUtilization
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1CommitmentsUtilizationResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: commitmentId
        description: Required. The commitment id.
        in: path
        required: true
        schema:
          type: string
      tags:
      - GuaranteedCommitments
  /v1/managements/accounts:
    get:
      summary: 'WORK-IN-PROGRESS: Lists payer accounts associated with the organization.'
      operationId: GuaranteedCommitments_ListPayerAccounts
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ListPayerAccountsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      tags:
      - GuaranteedCommitments
  /v1/managements/accounts/status:
    get:
      operationId: GuaranteedCommitments_GetPayerAccountStatus
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1GetPayerAccountStatusResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      tags:
      - GuaranteedCommitments
      summary: Guaranteed commitments get payer account status
      x-summary-source: derived
  /v1/managements/accounts/{companyId}:
    post:
      operationId: GuaranteedCommitments_SetPayerAccountEnabled
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1SetPayerAccountEnabledResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
      tags:
      - GuaranteedCommitments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuaranteedCommitmentsSetPayerAccountEnabledBody'
        required: true
      summary: Guaranteed commitments set payer account enabled
      x-summary-source: derived
  /v1/managements/billinggroups:
    get:
      operationId: GuaranteedCommitments_ListBillingGroups
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ListBillingGroupsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      tags:
      - GuaranteedCommitments
      summary: Guaranteed commitments list billing groups
      x-summary-source: derived
  /v1/managements/billinggroups/status:
    get:
      operationId: GuaranteedCommitments_GetBillingGroupStatus
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1GetBillingGroupStatusResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      tags:
      - GuaranteedCommitments
      summary: Guaranteed commitments get billing group status
      x-summary-source: derived
  /v1/managements/billinggroups/terms:accept:
    post:
      operationId: GuaranteedCommitments_AcceptBillingGroupTerms
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1AcceptBillingGroupTermsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      tags:
      - GuaranteedCommitments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1AcceptBillingGroupTermsRequest'
        required: true
      summary: Guaranteed commitments accept billing group terms
      x-summary-source: derived
  /v1/managements/billinggroups/{companyId}:
    post:
      operationId: GuaranteedCommitments_SetBillingGroupStatus
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1SetBillingGroupStatusResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
      tags:
      - GuaranteedCommitments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuaranteedCommitmentsSetBillingGroupStatusBody'
        required: true
      summary: Guaranteed commitments set billing group status
      x-summary-source: derived
  /v1/metrics:
    get:
      summary: 'WORK-IN-PROGRESS: Do not use.'
      operationId: GuaranteedCommitments_GetMetrics
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1MetricsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: provider
        in: query
        required: false
        schema:
          type: string
          enum:
          - PROVIDER_UNSPECIFIED
          - AWS
          - AZURE
          - GCP
          - KUBERNETES
          - UNKNOWN
          default: PROVIDER_UNSPECIFIED
      tags:
      - GuaranteedCommitments
  /v1/onboarding:
    post:
      summary: 'WORK-IN-PROGRESS: Registers a new child organization under the channel partner.'
      operationId: GuaranteedCommitments_RegisterOrg
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1RegisterOrgResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      tags:
      - GuaranteedCommitments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1RegisterOrgRequest'
        required: true
  /v1/onboarding/aws/cftemplate/guaranteed:
    post:
      summary: CreateGuaranteedCommitmentAccess verifies and registers a deployed guaranteed…
      operationId: GuaranteedCommitments_CreateGuaranteedCommitmentAccess
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1CreateGuaranteedCommitmentAccessResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      tags:
      - GuaranteedCommitments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1CreateGuaranteedCommitmentAccessRequest'
        required: true
  /v1/onboarding/aws/cftemplate/guaranteed:url:
    get:
      summary: GetGuaranteedCommitmentTemplateUrl returns a CloudFormation launch URL for…
      operationId: GuaranteedCommitments_GetGuaranteedCommitmentTemplateUrl
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1GetGuaranteedCommitmentTemplateUrlResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: externalId
        description: The guaranteed-commitments-provided external ID for the guaranteed-commitments IAM role trust policy.
        in: query
        required: false
        schema:
          type: string
      tags:
      - GuaranteedCommitments
  /v1/onboarding/aws/cloudformation/launchstackurl:
    get:
      summary: 'WORK-IN-PROGRESS: Generates AWS CloudFormation launch stack URL.'
      operationId: GuaranteedCommitments_GetAwsLaunchStackUrl
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1GetAwsLaunchStackUrlResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: billingGroupId
        description: 'Optional: if present => MSP customer (3rd layer), else MSP-level org (2nd layer)'
        in: query
        required: false
        schema:
          type: string
      - name: companyId
        in: query
        required: false
        schema:
          type: string
      - name: gcOrgId
        in: query
        required: false
        schema:
          type: string
      - name: payerAccountId
        in: query
        required: false
        schema:
          type: string
      - name: payerAccountName
        in: query
        required: false
        schema:
          type: string
      tags:
      - GuaranteedCommitments
  /v1/onboarding/aws/cloudformation/template:
    get:
      summary: 'WORK-IN-PROGRESS: Generates CloudFormation template for AWS integration.'
      operationId: GuaranteedCommitments_GetAwsCloudFormationTemplate
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1GetAwsCloudFormationTemplateResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: billingGroupId
        description: 'Optional: if present => MSP customer (3rd layer), else MSP-level org (2nd layer)'
        in: query
        required: false
        schema:
          type: string
      - name: companyId
        in: query
        required: false
        schema:
          type: string
      - name: gcOrgId
        in: query
        required: false
        schema:
          type: string
      - name: payerAccountId
        in: query
        required: false
        schema:
          type: string
      - name: payerAccountName
        in: query
        required: false
        schema:
          type: string
      tags:
      - GuaranteedCommitments
  /v1/onboarding/aws/privateoffer/{payerAccountId}:
    get:
      summary: Retrieves the AWS Marketplace private offer details for a payer account.
      operationId: GuaranteedCommitments_GetAwsPrivateOffer
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1GetAwsPrivateOfferResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: payerAccountId
        description: Required. The AWS payer account ID that the private offer targets.
        in: path
        required: true
        schema:
          type: string
      - name: recreate
        description: 'Optional. If true, recreate the private offer when the existing row is

          in a retryable terminal state: FAILED, EXPIRED, or WITHDRAWN.

          ACCEPTED, PENDING, and CREATING are not recreated.'
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - GuaranteedCommitments
  /v1/onboarding/aws/start:
    post:
      summary: 'WORK-IN-PROGRESS: Starts the onboarding process for an organization.'
      operationId: GuaranteedCommitments_StartAwsOnboarding
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1StartAwsOnboardingResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      tags:
      - GuaranteedCommitments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1StartAwsOnboardingRequest'
        required: true
  /v1/onboarding/aws/verify:
    post:
      summary: 'WORK-IN-PROGRESS: Runs AWS onboarding verification process.'
      operationId: GuaranteedCommitments_VerifyAwsOnboarding
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1VerifyAwsOnboardingResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      tags:
      - GuaranteedCommitments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1VerifyAwsOnboardingRequest'
        required: true
  /v1/onboarding/azure/integration:
    post:
      summary: 'WORK-IN-PROGRESS: Creates the Azure cloud integration after all onboarding…'
      operationId: GuaranteedCommitments_CreateAzureIntegration
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1CreateAzureIntegrationResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      tags:
      - GuaranteedCommitments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1CreateAzureIntegrationRequest'
        description: 'CreateAzureIntegrationRequest creates the final Azure integration (Step 8).

          Ripple fields are stored alongside Archera integration data to link

          the Azure tenant to the correct Ripple billing group/company/payer context.'
        required: true
  /v1/onboarding/azure/integrations:
    get:
      summary: 'WORK-IN-PROGRESS: Lists Azure integrations to verify onboarding completion'
      operationId: GuaranteedCommitments_ListAzureIntegrations
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ListAzureIntegrationsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: gcOrgId
        description: Required. Archera org ID.
