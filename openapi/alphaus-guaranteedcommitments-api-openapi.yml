          $ref: '#/definitions/v1ListOrgsRequest'
      tags:
      - GuaranteedCommitments
  /v1/reports/invoice/{month}/accounts:read:
    post:
      summary: Reads per-account commitment report details for a specific month. Only available in Ripple.
      operationId: GuaranteedCommitments_ReadCommitmentReportAccounts
