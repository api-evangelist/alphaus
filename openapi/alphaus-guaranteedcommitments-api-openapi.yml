            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/v1ReadCommitmentReportsRequest'
      tags:
      - GuaranteedCommitments
  /v1/resources:
    get:
      summary: 'WORK-IN-PROGRESS: Do not use. Retrieves a list of infrastructure resources for the organization.'
      operationId: GuaranteedCommitments_ListResources
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListResourcesResponse'
        default:
