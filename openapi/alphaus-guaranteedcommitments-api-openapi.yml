      accountIds:
        type: array
        items:
          type: string
      blobContainer:
        type: string
      resourceGroup:
        type: string
      storageAccount:
        type: string
      roleName:
        type: string
      resourceGroupRegion: {}
      storageAccountRegion: {}
      resourceGroupTags: {}
      storageAccountTags: {}
    description: 'CreateAzureIntegrationRequest creates the final Azure integration (Step 8).

      Ripple fields are stored alongside Archera integration data to link

      the Azure tenant to the correct Ripple billing group/company/payer context.'
  v1RegisterOrgResponse:
    type: object
    properties:
      id:
        type: string
      name:
        type: string
      memberships:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Membership'
        title: GuaranteedCommitments create-org response fields
      domain:
        type: string
      primaryAddress:
        $ref: '#/definitions/v1Address'
      awsMarketplaceOfferLink:
        type: string
      azureMarketplaceOfferLink:
        type: string
      gcpMarketplaceOfferLink:
        type: string
