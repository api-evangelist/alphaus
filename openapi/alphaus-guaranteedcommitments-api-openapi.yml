        type: string
        description: URL of the CloudFormation template used to create or update the stack.
      status:
        type: string
        description: Current status of the access configuration or underlying CloudFormation stack.
      lastUpdated:
        type: string
        description: Last update time of this configuration, typically as an ISO 8601 timestamp.
      guaranteedCommitmentVerified:
        type: boolean
        description: Whether the guaranteed commitment role was successfully verified during registration.
