      externalId:
        type: string
        description: Alphaus/Ripple external ID for role assumption.
      guaranteedCommitmentPrincipal:
        type: string
        description: Guaranteed commitment AWS principal ARN.
      guaranteedCommitmentExternalId:
        type: string
        description: Guaranteed commitment external ID for role assumption.
