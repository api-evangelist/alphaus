    type: object
    properties:
      gcOrgId:
        type: string
        description: Required. The Archera org ID.
      type:
        type: string
        description: '---- Azure resource config fields ----

          Integration type, always "cloud/azure".'
      tenantId:
        type: string
      subscriptionId:
        type: string
      accountKind:
        type: string
        title: '"subscription" or "billing_account"'
      accountIds:
        type: array
        items:
          type: string
      blobContainer:
        type: string
      resourceGroup:
        type: string
      storageAccount:
        type: string
      roleName:
        type: string
