        type: string
        description: Ripple billing group ID — links this Azure integration to the Ripple billing group.
      companyId:
        type: string
        description: Ripple company ID — links this Azure integration to the Ripple company/customer.
      payerAccountId:
        type: string
        description: Ripple payer account ID — if applicable, the payer account this Azure spend rolls
          up to.
      type:
        type: string
        description: Integration type, always "cloud/azure".
      tenantId:
        type: string
      subscriptionId:
        type: string
      onboardingId:
        type: string
