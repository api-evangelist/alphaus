    properties:
      target:
        type: string
        description: Target environment for the access configuration (for example, AWS account ID or organization).
      rippleRoleArn:
        type: string
        description: ARN of the Ripple/Alphaus IAM role to be assumed for managing guaranteed commitments.
      rippleExternalId:
        type: string
        description: External ID required to assume the Ripple/Alphaus IAM role.
      guaranteedCommitmentRoleArn:
        type: string
        description: ARN of the customer's IAM role used specifically for guaranteed-commitment operations.
      guaranteedCommitmentExternalId:
        type: string
        description: External ID required to assume the guaranteed-commitment IAM role.
      stackId:
        type: string
        description: CloudFormation stack ID created or used during the access configuration.
      stackRegion:
        type: string
        description: AWS region where the CloudFormation stack is deployed (for example, "us-east-1").
