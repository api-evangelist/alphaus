  v1ReadCostsRequestAzureOptions:
    type: object
    properties:
      groupByColumns:
        type: string
        description: 'Optional. A comma-separated list of columns to aggregate the data into. Valid values are `serviceName`, `productName`, `region`, `chargeType`, `description`, `billableQuantity`, `effectiveUnitPrice`, `timeInterval`, `billingType`, `alternateId`, `domainName` and `resourceGroup`. A special value of `none` is also supported, which means query by date or month per account only.


          For example, if you only want the services and region data, you can set this field to `serviceName,region`. Your input sequence doesn''t matter (although the sequence above is recommended) as the actual sequence is already fixed in the return data (see the definition in https://github.com/alphauslabs/blueapi/blob/main/api/azure/cost.proto), which is generic to specific, top to bottom. Invalid values are discarded. Excluded columns will be empty.'
      groupByMonth:
        type: boolean
        description: Optional. If set to true, return data grouped by month within the date range. If you want data that is grouped per account per month, set this to `true`. You can also use `groupByColumns` while setting this to true.
      noCache:
        type: boolean
        description: If true, force API to not use cached data.
      toCurrency:
        type: string
        description: Optional. Set to US dollars (USD) by default (AWS CUR's default currency). You can set it to the desired three-letter currency symbol (i.e. JPY, EUR, GBP), in which case, it will use the latest exchange rates provided by https://fixer.io. If you prefer a custom exchange rate, you can append the rate to the currency's three-letter symbol. For example, `JPY:110.622` for the Japanese Yen. Note that the exchange rate should be against the US dollar (USD).
      resourceGroup:
        type: string
        description: Optional. You can set it to a single resource group or a comma-separated list of resource groups.
    description: Azure-specific options for ReadCostsRequest.
