  CostCreateCalculationsScheduleBody:
    type: object
    properties:
      schedule:
        type: string
        description: 'Required. The desired schedule in UTC, using the unix-cron string format `* * * * *` which is a set of five fields in a line using the order: `minute hour day-of-the-month month day-of-the-week`.


          * `minute` values can be `0-59`

          * `hour` values can be `0-23`

          * `day-of-the-month` values can be `1-31`

          * `month` values can be `1-12`, or `JAN-DEC`

          * `day-of-the-week` values can be `0-6`, or `SUN-SAT`, or `7` for Sunday


          Special characters:

          * A field can contain an asterisk (*), which always stands for "first-last".

          * Ranges are two numbers separated with a hyphen (-) and the specified range is inclusive.

          * Following a range with `/NUMBER` specifies skips of the number''s value through the range. For example, both `0-23/2` and `*/2` can be used in the `hour` field to specify execution every two hours.

          * A list is a set of numbers (or ranges) separated by commas (,). For example, `1,2,5,6` in the `month` field specifies an execution on the first, second, fifth, and sixth days of the month.'
      scheduleMacro:
        type: string
        description: 'Optional. Non-standard macro(s) that augment(s) `schedule`''s behavior. The only supported value for now is `@endofmonth`.


          `@endofmonth` - If set, the backend scheduler will only use the `minute` and `hour` part of `schedule`''s value and set the days to 28th, 29th, 30th, and 31st but the runner will do the filtering for the actual end of the trigger month. Note that this is different than setting `schedule` to, say, `0 0 28-31 * *`.'
      targetMonth:
        type: string
        description: 'Optional. The desired month to calculate. If not set, defaults to previous month. The only supported value for now is `@current`.


          `@current` - If set, calculate for the month the schedule is triggered (or current month).'
      notificationChannel:
        type: string
        description: Optional. The channel id to use for notifications. At the moment, only email-type notification channels are supported. If not set, your default channel will be used. And if non-existent, an email-type notification channel will be created using your primary email address.
      force:
        type: boolean
        description: Optional. Not used at the moment.
      dryRun:
        type: boolean
        description: Optional. If set to true, skips the actual calculations. Useful as test, or reminder.
    description: Request message for the Cost.CreateCalculationsSchedule rpc.
