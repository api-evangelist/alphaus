        type: string
      instanceType:
        type: string
      operation:
        type: string
      invoiceId:
        type: string
      description:
        type: string
      resourceId:
        type: string
      tags:
        type: object
        additionalProperties:
          type: string
      costCategories:
        type: object
        additionalProperties:
          type: string
