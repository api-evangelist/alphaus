  v1ListSharedResourcesResponse:
    type: object
    properties:
      sharedResources:
        type: array
        items:
          type: object
          $ref: '#/definitions/coverSharedResourcesCombination'
  CoverUpdateCostGroupImageBody:
    type: object
    properties:
      image:
        type: string
        description: Required. Image.
    title: Request message for UpdateCostGroupImage
  v1GetChannelDetailsResponse:
    type: object
    properties:
      channelData:
        $ref: '#/definitions/coverChannelData'
    title: Response message for GetChannelDetails
  coverCostGroupAzureOptions:
    type: object
    properties:
      filters:
        type: array
        items:
          type: object
          $ref: '#/definitions/coverCostGroupOptionsFilters'
        description: 'Optional. A list of filtering options. Multiple filter items will use the logical ''or'' operator, e.g. filter1 || filter2 || filter3, etc.

          A map of "key:value" column filters. The key indicates the column name while the value is the filter value prefixed by either "eq:" (equal), "re:" (regular expressions based on https://github.com/google/re2), or "!re:" (reverse "re:"). No prefix is the same as "eq:". Multiple map items will use the logical ''and'' operator, e.g. mapfilter1 && mapfilter2 && mapfilter3, etc.


          For example, if you like to filter `productCode` to return only `AmazonEC2`, set to `{"productCode":"eq:AmazonEC2"}` or `{"productCode":"AmazonEC2"}`. You can also use a regular expression like `{"productCode":"re:AmazonEC2|AmazonRDS"}`, which means return all AmazonEC2 or AmazonRDS lineitems. Or reverse regexp, such as `{"productCode":"!re:^AmazonEC2$"}`, which means return all items except `AmazonEC2`.'
      tagFilters:
        type: array
        items:
          type: object
          $ref: '#/definitions/coverCostGroupOptionsFilters'
        description: 'Optional. A list of filtering options. See [ReadCostsRequestAwsOptionsFilters] for more information on each filter item. Multiple filter items will use the logical ''or'' operator, e.g. filter1 || filter2 || filter3, etc.

