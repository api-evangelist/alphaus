  coverCostGroupCustomOptions:
    type: object
    properties:
      filters:
        type: array
        items:
          type: object
          $ref: '#/definitions/coverCostGroupOptionsFilters'
        description: Optional. A list of filtering options. Multiple filter items will use the logical 'or' operator, e.g. filter1 || filter2 || filter3, etc.
      tagFilters:
        type: array
        items:
          type: object
          $ref: '#/definitions/coverCostGroupOptionsFilters'
        description: 'Optional. A list of filtering options. See [ReadCostsRequestAwsOptionsFilters] for more information on each filter item. Multiple filter items will use the logical ''or'' operator, e.g. filter1 || filter2 || filter3, etc.

          A map of "key:value" tag filters. The key indicates the tag key while the value is the filter tag value which can be prefixed by either "eq:" (equal), "re:" (regular expressions based on https://github.com/google/re2), or "!re:" (reverse "re:"). No prefix is the same as "eq:". Multiple map items will use the logical ''and'' operator, e.g. mapfilter1 && mapfilter2 && mapfilter3, etc.


          For example, if you want to query lineitems with the tag `project:MY_PROJECT`, set to `{"project":"MY_PROJECT"}`. You can also use regular expressions for tag values, such as `{"name":"re:[A-Za-z0-9]*"}`.'
      labelFilters:
        type: array
        items:
          type: object
          $ref: '#/definitions/coverCostGroupOptionsFilters'
        description: 'Labels on gcp help you organize resources and manage your costs at scale, with the granularity you need.

          For example, on Compute Engine, you can use labels to group VMs in categories such as production, staging, or development so that you can search for resources that belong to each development stage.

          If you want to query lineitems with the label `vm-prod: prod`, set to `{"vm-prod":"prod"}`. You can also use regular expressions for tag values, such as `{"name":"re:[A-Za-z0-9]*"}`.'
      projectLabelFilters:
        type: array
        items:
          type: object
          $ref: '#/definitions/coverCostGroupOptionsFilters'
        description: "Project Labels refers to labels that have been assigned to GCP projects. \nFor example, projectId \"mobingi-main\" assigned as \"env:prod\"\nIf you want to query lineitems with the label `env: prod`, set to `{\"env\":\"prod\"}`. You can also use regular expressions for tag values, such as `{\"name\":\"re:[A-Za-z0-9]*\"}`."
    description: Custom-specific options for CreateCostGroupRequest.
