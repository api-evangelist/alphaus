openapi: 3.2.0
info:
  title: Blue API reference Cover API
  description: Alphaus provides an API for interacting with its services.
  version: v1
servers:
- url: https://api.alphaus.cloud/m/blue
tags:
- name: Cover
  description: '(BETA) Cover API. Base URL: https://api.alphaus.cloud/m/blue/cover'
  externalDocs:
    description: Service definition
    url: https://github.com/alphauslabs/blueapi/tree/main/cover/
paths:
  /v1/account:
    post:
      summary: Registers GCP/Azure account
      operationId: Cover_RegisterDataAccess
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      tags:
      - Cover
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1RegisterDataAccessRequest'
        description: Request message for Register Data Access. For azure and gcp.
        required: true
  /v1/account/all:read:
    post:
      summary: Lists Azure and GCP accounts
      operationId: Cover_ListDataAccess
      responses:
        '200':
          description: A successful response.(streaming responses)
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/v1DataAccess'
                  error:
                    $ref: '#/components/schemas/rpcStatus'
                title: Stream result of v1DataAccess
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      tags:
      - Cover
