  /v1/account/{target}:
    get:
      summary: Gets the current account. For GCP and Azure
      operationId: Cover_GetDataAccess
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1DataAccess'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: target
        description: Required. (Billing ID for GCP / Account ID for Azure)
        in: path
        required: true
        schema:
          type: string
      - name: vendor
        description: Vendor (GCP/Azure)
        in: query
        required: false
        schema:
          type: string
      - name: accountType
        description: In the context of fetching account details, specifying the account type is necessary. This is because the target alone might not uniquely identify an account and could result in multiple data points.
        in: query
        required: false
        schema:
          type: string
      tags:
      - Cover
    delete:
      summary: Deletes GCP or Azure accounts based on the provided request
      operationId: Cover_DeleteDataAccess
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: target
        description: Required. (Billing ID for GCP / Account ID for Azure)
        in: path
        required: true
        schema:
          type: string
      - name: vendor
        description: Vendor (GCP/Azure)
        in: query
        required: false
        schema:
          type: string
      - name: accountType
        description: In the context of fetching account details, specifying the account type is necessary. This is because the target alone might not uniquely identify an account and could result in multiple data points.
        in: query
        required: false
        schema:
          type: string
      tags:
      - Cover
    put:
      summary: Update GCP/Azure account info
      operationId: Cover_UpdateDataAccess
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: target
        description: Billing Id for GCP, Account Id for Azure
        in: path
        required: true
        schema:
          type: string
      tags:
      - Cover
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoverUpdateDataAccessBody'
        required: true
