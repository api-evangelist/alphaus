aid: alphaus
name: Alphaus
description: >-
  Alphaus is a Tokyo-based cloud FinOps company (No. 1 in Japan) whose platform helps enterprises,
  managed service providers, and cloud resellers manage and optimize multi-cloud spend across AWS,
  Azure, and GCP. Its products include Octo (cost visibility and optimization), Ripple and WavePro
  (reseller billing automation and invoicing), and Cover (cost anomaly detection and recommendation
  intelligence). Developers integrate through the Blue API — a unified protobuf/gRPC surface with a
  grpc-gateway JSON/REST proxy and generated OpenAPI — spanning 15 services and nearly 600 operations,
  complemented by the bluectl CLI and Go, Python, and TypeScript SDKs.
